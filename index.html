    }
    ctx.putImageData(data,0,0);

function useConfetti(){
  const [pieces,setPieces]=useState([]);
  const burst=(x,y)=>{
    const n=14, newPieces=Array.from({length:n},(_,i)=>{
      const angle=Math.random()*Math.PI*2, dist=60+Math.random()*90;
      return {id:Date.now()+i, x, y,
        dx:Math.cos(angle)*dist, dy:Math.sin(angle)*dist-40,
        rot:(Math.random()*360)+"deg",
        color:["#6e9a64","#e69ef4","#ea8891","#a9c9a0"][i%4]};
    });
    setPieces(p=>[...p,...newPieces]);
    setTimeout(()=>setPieces(p=>p.filter(pc=>!newPieces.includes(pc))),900);
  };
  const layer=(<>{pieces.map(pc=>(
    <span key={pc.id} className="confetti-piece" style={{left:pc.x,top:pc.y,background:pc.color,"--dx":pc.dx+"px","--dy":pc.dy+"px","--rot":pc.rot}}/>
  ))}</>);
  return [layer,burst];
}

function useConfettiRain(){
  const [pieces,setPieces]=useState([]);
  const trigger=()=>{
    const colors=["#6e9a64","#e69ef4","#ea8891","#a9c9a0","#efb8f7"];
    const newPieces=Array.from({length:60},(_,i)=>({
      id:"r"+Date.now()+i, left:Math.random()*100,
      dur:2.4+Math.random()*1.1, delay:Math.random()*0.5,
      rot:(Math.random()*360)+"deg", color:colors[i%colors.length]
    }));
    setPieces(newPieces);
    setTimeout(()=>setPieces([]),3600);
  };
  const layer=(<>{pieces.map(pc=>(
    <span key={pc.id} className="confetti-fall" style={{left:pc.left+"%",background:pc.color,animationDuration:pc.dur+"s",animationDelay:pc.delay+"s","--rot":pc.rot}}/>
  ))}</>);
  return [layer,trigger];
}

const STAGES=[{id:1,label:"1x",name:"Preliminaries"},{id:2,label:"2x",name:"Semi Finals"},{id:3,label:"3x",name:"Finals"}];

const Q_PALETTES=[
  "linear-gradient(150deg,#fdf1f3 0%,#f9effb 50%,#f0f6ed 100%)",
  "linear-gradient(150deg,#f2f8ee 0%,#fbf2f6 50%,#faeefb 100%)",
  "linear-gradient(150deg,#fbeef1 0%,#f5effa 45%,#edf5e9 100%)",
];
function gradientFor(slide,total){
  if(slide===0) return "linear-gradient(150deg,#f7e2fb 0%,#fff5f1 50%,#e1eddc 100%)";
  if(slide===total-1) return "linear-gradient(160deg,#fde3e6 0%,#f5ebfa 55%,#e1eddc 100%)";
  return Q_PALETTES[(slide-1)%Q_PALETTES.length];
}

function TeamSlot({teams,activeId,otherId,setActiveId,adjust,letter,delay}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    if(!open) return;
    const onDown=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    const onKey=e=>{ if(e.key==="Escape") setOpen(false); };
    document.addEventListener("mousedown",onDown); document.addEventListener("keydown",onKey);
    return ()=>{document.removeEventListener("mousedown",onDown);document.removeEventListener("keydown",onKey);};
  },[open]);
  const team=teams.find(t=>t.id===activeId);
  const grad=letter==="A"?"from-emerald-400 to-teal-400":"from-sky-400 to-cyan-400";
  const bar=letter==="A"?"bg-emerald-400":"bg-sky-400";
  const ring=letter==="A"?"ring-a":"ring-b";
  const glow=letter==="A"?"glow-a text-emerald-700":"glow-b text-sky-700";
  return (
    <div className={`enter relative flex-1 min-w-[380px] flex items-center gap-3 rounded-2xl border border-emerald-100/80 backdrop-blur-md bg-white/70 shadow-md pl-5 pr-4 py-4 ${ring}`} style={{animationDelay:delay+"ms",zIndex:open?40:undefined}}>
      <span className={`absolute top-0 left-0 right-0 h-1.5 rounded-t-2xl ${bar}`}/>
      <span className={`w-12 h-12 rounded-full flex items-center justify-center font-head font-bold text-xl text-white bg-gradient-to-br ${grad} shadow-md ring-4 ring-white/80`}>{letter}</span>
      <div className="flex flex-col flex-1 min-w-0">
        <span className="text-xs font-medium text-slate-500 mb-0.5">Team {letter}</span>
        <div ref={ref} data-nonav="1" className="relative w-fit">
          <button type="button" onClick={()=>setOpen(o=>!o)} aria-haspopup="listbox" aria-expanded={open}
            className={`flex items-center gap-2 pl-4 pr-3 py-1.5 rounded-xl border-2 bg-white font-head font-bold text-slate-800 text-2xl leading-tight shadow-sm transition-all hover:shadow-md hover:-translate-y-0.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300 ${open?"border-emerald-600":"border-emerald-400"}`}>
            <span className="truncate">{team.name}</span>
            <ChevDown size={20} strokeWidth={2.5} className={`text-emerald-600 transition-transform duration-200 ${open?"rotate-180":""}`}/>
          </button>
          {open && (
            <div role="listbox" className="pop origin-top-left absolute left-0 top-full mt-2 w-64 max-h-72 overflow-y-auto rounded-2xl border-2 border-emerald-300 bg-white shadow-xl p-1.5 z-50">
              {teams.map(t=>{
                const disabled=t.id===otherId, selected=t.id===activeId;
                return (
                  <button key={t.id} type="button" role="option" aria-selected={selected} disabled={disabled}
                    onClick={()=>{setActiveId(t.id);setOpen(false);}}
                    className={`w-full flex items-center justify-between gap-3 px-3 py-2 rounded-xl text-left font-semibold text-base transition-colors ${selected?"bg-emerald-100 text-emerald-800":disabled?"text-slate-300 cursor-not-allowed":"text-slate-700 hover:bg-emerald-50"}`}>
                    <span className="flex items-center gap-2">{selected?<Check size={15} strokeWidth={3} className="text-emerald-600"/>:<span className="w-[15px]"/>}{t.name}</span>
                    <span className="font-mono text-xs text-slate-400">{disabled?"in play":t.score}</span>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </div>
      <span key={team.score} className={`pop font-head text-4xl font-bold font-mono leading-none px-1 ${glow}`}>{team.score}</span>
      <div className="flex flex-col gap-1">
        <button onClick={()=>adjust(activeId,5)} className="rounded-lg px-2.5 py-1 text-sm font-bold bg-emerald-100 text-emerald-700 hover:bg-emerald-200 hover:scale-110 active:scale-90 transition-transform">+5</button>
        <button onClick={()=>adjust(activeId,-5)} className="rounded-lg px-2.5 py-1 text-sm font-bold bg-emerald-100 text-emerald-700 hover:bg-emerald-200 hover:scale-110 active:scale-90 transition-transform">−5</button>
      </div>
    </div>
  );
}

  return (
    <div className="flex-1 flex flex-col items-center justify-center px-6 py-6 text-center">
      <div className="pop w-40 h-40 md:w-56 md:h-56 rounded-full glass border-4 border-emerald-300 flex items-center justify-center mb-6 shadow-[0_0_70px_rgba(110,154,100,.35)]"><Trophy size={90} className="text-emerald-600 md:hidden"/><Trophy size={130} className="text-emerald-600 hidden md:block"/></div>

        {allZero?"No points on the board yet!":tie?"It's a tie!":winners[0].name+" wins!"}

      {!allZero && (
        <div className="enter flex flex-wrap justify-center gap-5 w-full" style={{animationDelay:"220ms"}}>
          {winners.map(t=>(
            <div key={t.id} className="relative overflow-hidden bg-white/90 backdrop-blur-sm rounded-3xl border border-emerald-200 ring-a shadow-lg px-14 py-8 min-w-[320px]">
              <span className="absolute top-0 right-0 bg-gradient-to-bl from-cyan-300 to-cyan-400 text-emerald-900 text-[11px] font-bold px-3.5 py-1 rounded-bl-xl">{tie?"TIED 1ST":"1ST PLACE"}</span>

              <div className="font-head text-3xl font-bold text-slate-900 mb-1">{t.name}</div>

          ))}
        </div>
      )}

  );
}

          </div>

        </div>
        {tab==="leaderboard" ? (
          <div className="space-y-2">

              <div key={t.id} className="flex items-center justify-between glass border border-slate-100 rounded-xl px-4 py-2.5 shadow-sm">
                <div className="flex items-center gap-3">
                  <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${i===0?"bg-cyan-200 text-cyan-800":i===1?"bg-sky-100 text-sky-800":i===2?"bg-emerald-100 text-emerald-800":"text-slate-400"}`}>{i+1}</span>

          </div>
        )}
        <button type="button" onClick={onAdd} className="mt-3 w-full flex items-center justify-center gap-2 py-2.5 rounded-xl border-2 border-dashed border-emerald-300 text-emerald-700 font-bold text-sm hover:bg-emerald-50 hover:scale-[1.01] active:scale-95 transition-all"><Plus size={16}/> Add group</button>
      </div>
    </div>
  );
}

function App(){
  const [teams,setTeams]=useState(TEAMS_INIT);
  const [aId,setA]=useState("g1");
  const [bId,setB]=useState("g2");
  const [multiplier,setMultiplier]=useState(1);
  const [slide,setSlide]=useState(0);
  const [revealed,setRevealed]=useState(QUESTIONS.map(()=>({})));
  const [hints,setHints]=useState(QUESTIONS.map(()=>({})));
  const [panelOpen,setPanelOpen]=useState(false);
  const [revealModal,setRevealModal]=useState(null);
  const [hintModal,setHintModal]=useState(null);
  const [confettiLayer,burst]=useConfetti();
  const [rainLayer,rainTrigger]=useConfettiRain();

  const adjust=(id,d)=>setTeams(p=>p.map(t=>t.id===id?{...t,score:t.score+d}:t));
  const openReveal=(qi,i,text,points)=>{
    setRevealed(prev=>{const next=[...prev];next[qi]={...next[qi],[i]:true};return next;});
    setRevealModal({qi,i,text,points});
  };
  const handleAward=(team)=>{
    if(!revealModal) return;
    adjust(team==="A"?aId:bId,revealModal.points);
    burst(window.innerWidth/2, window.innerHeight*0.4);
    setRevealModal(null);
  };
  const handleSkip=()=>setRevealModal(null);
  const askHint=(qi,i)=>{ if(hints[qi][i]) return; setHintModal({qi,i,cost:50*multiplier}); };
  const payHint=(team)=>{
    if(!hintModal) return;
    const {qi,i,cost}=hintModal;
    adjust(team==="A"?aId:bId,-cost);
    setHints(prev=>{const n=[...prev];n[qi]={...n[qi],[i]:true};return n;});
    setHintModal(null);
  };
  const addTeam=()=>setTeams(p=>{
    const n=p.reduce((m,t)=>Math.max(m,parseInt((t.name.match(/(\d+)\s*$/)||[])[1]||0,10)),0)+1;
    return [...p,{id:"g"+Date.now(),name:"Group "+n,score:0}];
  });
  const removeTeam=(id)=>{
    if(teams.length<=2) return;
    const rest=teams.filter(t=>t.id!==id);
    setTeams(rest);
    if(aId===id) setA(rest.find(t=>t.id!==bId).id);
    if(bId===id) setB(rest.find(t=>t.id!==aId).id);
  };
  const resetQuestion=qi=>{setRevealed(prev=>{const next=[...prev];next[qi]={};return next;});setRevealModal(null);};

  const qIndex=slide-1;
  const isIntro=slide===0, isResults=slide===TOTAL_SLIDES-1;

  useEffect(()=>{
    const onKey=(e)=>{
      if(panelOpen||revealModal||hintModal) return;
      if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
      if(document.activeElement.closest&&document.activeElement.closest("[data-nonav]")) return;
      if(e.key==="ArrowRight") setSlide(s=>Math.min(TOTAL_SLIDES-1,s+1));
      if(e.key==="ArrowLeft") setSlide(s=>Math.max(0,s-1));
    };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[panelOpen,revealModal,hintModal]);

  useEffect(()=>{
    if(isResults) rainTrigger();
  },[isResults]);

  return (
    <div className="h-screen w-full flex flex-col relative isolate overflow-hidden" style={{background:gradientFor(slide,TOTAL_SLIDES),transition:"background .6s ease"}}>
      <FloralBg/>
      <Header teams={teams} aId={aId} bId={bId} setA={setA} setB={setB} adjust={adjust} onTeams={()=>setPanelOpen(true)} multiplier={multiplier} setMultiplier={setMultiplier}/>

      <div key={slide} className="flex-1 flex flex-col min-h-0 overflow-y-auto overflow-x-hidden">
        {isIntro && <IntroSlide/>}
        {!isIntro && !isResults && (
          <div className="flex-1 flex flex-col items-center px-6 py-4 max-w-[1320px] mx-auto w-full min-h-[640px]">
            <div className="enter w-full flex items-start justify-between mb-3 shrink-0">
              <span className="text-sky-500 text-sm font-bold tracking-widest">QUESTION {qIndex+1}</span>
              <button onClick={()=>resetQuestion(qIndex)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full glass border border-slate-100 text-slate-600 text-xs font-bold shadow-sm hover:scale-105 active:scale-95 transition-transform">
                <Undo size={13}/> Hide answers
              </button>
            </div>
            <h3 className="enter font-head text-2xl md:text-3xl font-bold text-emerald-900 text-left w-full mb-5 shrink-0" style={{animationDelay:"100ms"}}>{QUESTIONS[qIndex].prompt}</h3>
            <div className="tile-grid gap-5 w-full flex-1 min-h-0">
              {QUESTIONS[qIndex].answers.map(([text,points,hintText],i)=>(
                <AnswerTile key={i} index={i} text={text} points={points*multiplier} revealed={!!revealed[qIndex][i]} hint={!!hints[qIndex][i]} hintText={hintText}
                  onReveal={ii=>openReveal(qIndex,ii,text,points*multiplier)} onHint={ii=>askHint(qIndex,ii)} hintCost={50*multiplier} delay={140+i*60}/>
              ))}
            </div>
          </div>
        )}
        {isResults && <ResultsSlide teams={teams}/>}
      </div>

      <footer className="relative z-30 shrink-0 flex items-center justify-between px-6 py-3 glass border-t border-slate-200/70">
        <span className="text-[11px] text-slate-400 w-[110px]">← → to navigate</span>
        <div className="flex items-center gap-4">
          <button type="button" aria-label="Previous slide" onClick={()=>setSlide(s=>Math.max(0,s-1))} disabled={slide===0}
            className="w-11 h-11 rounded-full border-2 border-emerald-400 bg-white text-emerald-700 flex items-center justify-center shadow-sm hover:bg-emerald-50 hover:scale-110 active:scale-90 disabled:opacity-30 disabled:hover:scale-100 transition-all"><ChL size={22} strokeWidth={2.5}/></button>
          <span className="font-mono text-sm font-semibold text-slate-600 min-w-[64px] text-center">{slide+1} / {TOTAL_SLIDES}</span>
          <button type="button" aria-label="Next slide" onClick={()=>setSlide(s=>Math.min(TOTAL_SLIDES-1,s+1))} disabled={slide===TOTAL_SLIDES-1}
            className="w-11 h-11 rounded-full border-2 border-emerald-400 bg-white text-emerald-700 flex items-center justify-center shadow-sm hover:bg-emerald-50 hover:scale-110 active:scale-90 disabled:opacity-30 disabled:hover:scale-100 transition-all"><ChR size={22} strokeWidth={2.5}/></button>
        </div>
        <span className="w-[110px]"/>
      </footer>
      <TeamsPanel open={panelOpen} onClose={()=>setPanelOpen(false)} teams={teams} setTeams={setTeams} onAdd={addTeam} onRemove={removeTeam}/>
      <RevealModal data={revealModal} teams={teams} aId={aId} bId={bId} onAward={handleAward} onSkip={handleSkip}/>
      <HintModal data={hintModal} teams={teams} aId={aId} bId={bId} onPay={payHint} onCancel={()=>setHintModal(null)}/>
      {confettiLayer}
      {rainLayer}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
