function useConfetti(){
  const [pieces,setPieces]=useState([]);
  const burst=(x,y)=>{
    const n=14, newPieces=Array.from({length:n},(_,i)=>{
      const angle=Math.random()*Math.PI*2, dist=60+Math.random()*90;
      return {id:Date.now()+i, x, y,
        dx:Math.cos(angle)*dist, dy:Math.sin(angle)*dist-40,
        rot:(Math.random()*360)+"deg",
        color:["#6ee7b7","#93c5fd","#fcd34d","#f9a8d4"][i%4]};
    });
    setPieces(p=>[...p,...newPieces]);
    setTimeout(()=>setPieces(p=>p.filter(pc=>!newPieces.includes(pc))),900);
  };
  const layer=(<>{pieces.map(pc=>(
    <span key={pc.id} className="confetti-piece" style={{left:pc.x,top:pc.y,background:pc.color,"--dx":pc.dx+"px","--dy":pc.dy+"px","--rot":pc.rot}}/>
  ))}</>);
  return [layer,burst];
}

function useConfettiRain(){
  const [pieces,setPieces]=useState([]);
  const trigger=()=>{
    const colors=["#6ee7b7","#93c5fd","#5eead4","#a5f3fc","#bbf7d0"];
    const newPieces=Array.from({length:60},(_,i)=>({
      id:"r"+Date.now()+i, left:Math.random()*100,
      dur:2.4+Math.random()*1.1, delay:Math.random()*0.5,
      rot:(Math.random()*360)+"deg", color:colors[i%colors.length]
    }));
    setPieces(newPieces);
    setTimeout(()=>setPieces([]),3600);
  };
  const layer=(<>{pieces.map(pc=>(
    <span key={pc.id} className="confetti-fall" style={{left:pc.left+"%",background:pc.color,animationDuration:pc.dur+"s",animationDelay:pc.delay+"s","--rot":pc.rot}}/>
  ))}</>);
  return [layer,trigger];
}

const Q_PALETTES=[
  "linear-gradient(150deg,#ecfdf5 0%,#f0fdfa 45%,#eff6ff 100%)",
  "linear-gradient(150deg,#eff6ff 0%,#f5f3ff 45%,#fdf4ff 100%)",

function gradientFor(slide,total){
  if(slide===0) return "linear-gradient(150deg,#d1fae5 0%,#ffffff 50%,#dbeafe 100%)";
  if(slide===total-1) return "linear-gradient(160deg,#fef9c3 0%,#ecfdf5 55%,#e0f2fe 100%)";
  return Q_PALETTES[(slide-1)%Q_PALETTES.length];
}

function TeamSlot({teams,activeId,otherId,setActiveId,adjust,letter,delay}){
  const grad=letter==="A"?"from-emerald-400 to-teal-400":"from-sky-400 to-cyan-400";
  const bar=letter==="A"?"bg-emerald-400":"bg-sky-400";
  const ring=letter==="A"?"ring-a":"ring-b";
  const glow=letter==="A"?"glow-a text-emerald-700":"glow-b text-sky-700";
  return (
    <div className={`enter relative overflow-hidden flex-1 min-w-[340px] flex items-center gap-3 rounded-2xl border border-emerald-100/80 backdrop-blur-md bg-white/70 shadow-md pl-5 pr-4 py-4 transition-transform hover:scale-[1.02] hover:shadow-lg ${ring}`} style={{animationDelay:delay+"ms"}}>
      <span className={`absolute top-0 left-0 right-0 h-1.5 ${bar}`}/>
      <span className={`w-10 h-10 rounded-full flex items-center justify-center font-head font-bold text-base text-white bg-gradient-to-br ${grad} shadow-md ring-4 ring-white`}>{letter}</span>
      <div className="flex flex-col flex-1 min-w-0">
        <span className="text-[11px] font-medium text-slate-400">Team {letter}</span>
        <div className="relative">
          <select value={activeId} onChange={e=>setActiveId(e.target.value)}
            className="appearance-none bg-white/70 border border-slate-200 rounded-lg pl-2 pr-6 py-0.5 font-head font-bold text-slate-800 text-base focus:outline-none focus:border-emerald-300 cursor-pointer hover:bg-white transition-colors">
            {teams.filter(t=>t.id!==otherId).map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
          <ChevDown size={14} className="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
        </div>
      </div>
      <span key={teams.find(t=>t.id===activeId).score} className={`pop font-head text-4xl font-bold font-mono leading-none px-1 ${glow}`}>{teams.find(t=>t.id===activeId).score}</span>
      <div className="flex flex-col gap-1">
        <button onClick={()=>adjust(activeId,5)} className="rounded-lg px-2.5 py-1 text-sm font-bold bg-emerald-100 text-emerald-700 hover:bg-emerald-200 hover:scale-110 active:scale-90 transition-transform">+5</button>

        <div className="pod flip-face w-full h-full flex items-center justify-between gap-3 px-6 py-5 bg-white/90 backdrop-blur-sm rounded-2xl border border-emerald-100 border-t-2 border-t-emerald-400/60 shadow-md hover:shadow-lg transition-shadow">
          <button onClick={()=>!revealed&&onReveal(index)} disabled={revealed} className="flex items-center gap-4 flex-1 min-w-0 hover:scale-[1.01] active:scale-[0.99] transition-transform text-left">
            <span className="relative w-12 h-12 shrink-0 rounded-full flex items-center justify-center font-head font-bold text-xl text-white bg-gradient-to-br from-sky-300 to-emerald-400 shadow-[0_0_16px_rgba(16,185,129,.4)]">
              {index+1}
              <Leaf size={11} className="absolute -bottom-1 -right-1 text-emerald-600 bg-white rounded-full p-[2px] shadow-sm" strokeWidth={2.5}/>
            </span>
            <span className="flex items-center gap-2 text-slate-500 text-lg leading-snug"><EyeI size={19} className="shrink-0"/> {hint? hintText : "Click to reveal"}</span>
          </button>
          <div className="flex items-center gap-2 shrink-0">
            <button onClick={()=>onHint(index)} className="p-3 rounded-lg bg-sky-500 text-white shadow-[0_0_12px_rgba(14,165,233,.5)] hover:bg-sky-600 hover:scale-110 active:scale-90 transition-transform"><Bulb size={18}/></button>
            <button onClick={()=>onReveal(index)} className="px-5 py-3 rounded-full bg-emerald-500 text-white text-base font-bold shadow-[0_0_14px_rgba(16,185,129,.4)] hover:bg-emerald-600 hover:scale-105 active:scale-95 transition-transform">Reveal</button>
          </div>
        </div>
        <div className="pod flip-face flip-back w-full h-full flex items-center justify-between gap-3 px-6 py-5 bg-white/90 backdrop-blur-sm rounded-2xl border border-emerald-200 border-t-2 border-t-sky-400/60 shadow-md">
          <span className="font-semibold text-slate-800 text-xl leading-snug pr-2">{text}</span>
          <div className="flex items-center gap-2 shrink-0">
            <span className="float bg-emerald-100 text-emerald-800 font-head font-extrabold px-4 py-2 rounded-lg text-2xl shadow-sm glow-a">+{points}</span>
            <button onClick={()=>onReveal(index)} className="text-sm font-bold px-3 py-2 rounded-lg bg-sky-50 text-sky-700 hover:bg-sky-100 hover:scale-105 active:scale-95 transition-transform">Award</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function RevealModal({data,teams,aId,bId,onAward,onSkip}){
  if(!data) return null;
  const a=teams.find(t=>t.id===aId), b=teams.find(t=>t.id===bId);
  return (
    <div className="fadeIn fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="pop glass border border-white rounded-3xl max-w-lg w-full px-8 py-9 text-center shadow-2xl">
        <span className="text-emerald-600 text-xs font-bold tracking-[0.25em] mb-3 block">CORRECT ANSWER REVEALED</span>
        <h3 className="font-head text-3xl font-bold text-slate-900 mb-4 leading-snug">{data.text}</h3>
        <div className="font-head text-6xl md:text-7xl font-black text-sky-500 mb-4">+{data.points}</div>
        <p className="text-slate-500 mb-6">Who gets the points?</p>
        <div className="grid grid-cols-2 gap-4 mb-5">
          <button onClick={()=>onAward("A")} className="rounded-2xl px-4 py-5 bg-gradient-to-br from-teal-400 to-sky-400 text-white shadow-md hover:scale-[1.04] active:scale-95 transition-transform">
            <div className="text-xs font-bold tracking-widest opacity-90">TEAM A</div>
            <div className="font-head text-xl font-bold">{a.name}</div>
            <div className="text-sm opacity-90 mt-1">{a.score} → {a.score+data.points}</div>
          </button>
          <button onClick={()=>onAward("B")} className="rounded-2xl px-4 py-5 bg-gradient-to-br from-emerald-300 to-teal-300 text-emerald-950 shadow-md hover:scale-[1.04] active:scale-95 transition-transform">
            <div className="text-xs font-bold tracking-widest opacity-80">TEAM B</div>
            <div className="font-head text-xl font-bold">{b.name}</div>
            <div className="text-sm opacity-80 mt-1">{b.score} → {b.score+data.points}</div>
          </button>
        </div>
        <button onClick={onSkip} className="text-sm text-slate-400 font-semibold hover:text-slate-600 transition-colors">Reveal only, no points</button>
      </div>
    </div>
  );
}

function IntroSlide(){
  const icons=[
    [Leaf,"-8%","18%",0,"text-emerald-400"],
    [Heart,"92%","22%",0.4,"text-sky-400"],
    [Droplet,"6%","78%",0.8,"text-sky-300"],
    [Sparkles,"90%","76%",1.2,"text-emerald-300"],
  ];
  return (
    <div className="flex-1 flex flex-col items-center justify-center px-6 text-center relative">
      {icons.map(([Ic,l,t,d,c],i)=>(
        <Ic key={i} size={34} strokeWidth={1.6} className={`float hidden md:block absolute opacity-70 ${c}`} style={{left:l,top:t,animationDelay:d+"s",animationDuration:(3+d)+"s"}}/>
      ))}
      <span className="enter text-sm font-bold tracking-[0.35em] text-sky-500 mb-4">A FAMILY FEUD-STYLE GAME</span>
      <h1 className="enter font-head grad-text text-7xl md:text-9xl font-bold mb-8 leading-none" style={{animationDelay:"80ms"}}>
        The Wellness<br/>Feud
      </h1>
      <p className="enter text-slate-500 text-base" style={{animationDelay:"200ms"}}>Use the arrow keys, or the buttons below, to move through the slides.</p>
    </div>
  );
}

function ResultsSlide({teams}){
  const top=Math.max(...teams.map(t=>t.score));
  const winners=teams.filter(t=>t.score===top);
  const tie=winners.length>1 && top>0, allZero=top===0;
  return (
    <div className="flex-1 flex flex-col items-center justify-center px-6 py-6 text-center">
      <div className="pop w-40 h-40 md:w-56 md:h-56 rounded-full glass border-4 border-emerald-300 flex items-center justify-center mb-6 shadow-[0_0_70px_rgba(16,185,129,.4)]"><Trophy size={90} className="text-emerald-600 md:hidden"/><Trophy size={130} className="text-emerald-600 hidden md:block"/></div>
      <span className="enter flex items-center gap-2 text-sm font-bold tracking-[0.3em] text-emerald-600 mb-3" style={{animationDelay:"80ms"}}><Sparkles size={16}/> FINAL RESULT <Sparkles size={16}/></span>
      <h2 className="enter font-head text-4xl md:text-6xl font-bold text-slate-900 mb-3" style={{animationDelay:"140ms"}}>
        {allZero?"No points on the board yet!":tie?"It's a tie!":winners[0].name+" wins!"}
      </h2>
      {tie && !allZero && <p className="text-slate-500 text-lg mb-6">{winners.map(w=>w.name).join(" & ")}</p>}
      <div className="enter glass border border-emerald-200 rounded-2xl px-10 py-5 flex items-center gap-3 shadow-md mb-8" style={{animationDelay:"200ms"}}>
        <Crown size={24} className="text-emerald-600"/><span className="font-head text-3xl font-bold text-slate-900">{top}</span><span className="text-slate-500 text-base">points</span>
      </div>
      <div className="enter grid grid-cols-1 sm:grid-cols-2 gap-5 w-full max-w-2xl" style={{animationDelay:"260ms"}}>
        {[...teams].sort((a,b)=>b.score-a.score).slice(0,2).map((t,i)=>{
          const isWinner=t.score===top && !allZero;
          const accent=i===0?"ring-a border-emerald-200":"ring-b border-sky-200";
          return (
            <div key={t.id} className={`relative overflow-hidden bg-white/90 backdrop-blur-sm rounded-3xl border ${accent} shadow-lg px-6 py-6 text-left`}>
              {isWinner && <span className="absolute top-0 right-0 bg-gradient-to-bl from-amber-300 to-amber-400 text-amber-900 text-[10px] font-bold px-3 py-1 rounded-bl-xl">{tie?"TIED":"WINNER"}</span>}
              <div className="flex items-center gap-2 mb-2">
                {isWinner? <Trophy size={20} className="text-amber-500"/> : <Users size={18} className="text-slate-400"/>}
                <span className="text-xs font-bold uppercase tracking-widest text-slate-400">{i===0?"1st place":"2nd place"}</span>
              </div>
              <div className="font-head text-2xl font-bold text-slate-900 mb-1">{t.name}</div>
              <div className={`font-head text-4xl font-bold font-mono ${i===0?"glow-a text-emerald-700":"glow-b text-sky-700"}`}>{t.score}<span className="text-base text-slate-400 font-sans font-normal ml-1">pts</span></div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TeamsPanel({open,onClose,teams,setTeams}){
  const [tab,setTab]=useState("leaderboard");
  if(!open) return null;
  const ranked=[...teams].sort((a,b)=>b.score-a.score);
  const rename=(id,name)=>setTeams(p=>p.map(t=>t.id===id?{...t,name}:t));
  const setScore=(id,val)=>setTeams(p=>p.map(t=>t.id===id?{...t,score:Math.max(0,Math.round(val/5)*5)}:t));
  return (
    <div className="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="pop glass border border-white rounded-3xl max-w-lg w-full p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
        <div className="flex items-center justify-between mb-4">
          <div className="flex gap-2">
            <button onClick={()=>setTab("leaderboard")} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-transform hover:scale-105 ${tab==="leaderboard"?"bg-emerald-500 text-white":"text-slate-500"}`}>Leaderboard</button>
            <button onClick={()=>setTab("manage")} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-transform hover:scale-105 ${tab==="manage"?"bg-emerald-500 text-white":"text-slate-500"}`}>Manage Teams</button>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 hover:scale-110 transition-transform"><X size={18}/></button>
        </div>
        {tab==="leaderboard" ? (
          <div className="space-y-2">
            {ranked.map((t,i)=>(
              <div key={t.id} className="flex items-center justify-between glass border border-slate-100 rounded-xl px-4 py-2.5 shadow-sm">
                <div className="flex items-center gap-3">
                  <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${i===0?"bg-amber-200 text-amber-800":i===1?"bg-slate-200 text-slate-700":i===2?"bg-orange-200 text-orange-800":"text-slate-400"}`}>{i+1}</span>
                  <span className="font-semibold text-sm text-slate-700">{t.name}</span>
                </div>
                <span className="font-head font-bold text-emerald-600">{t.score}</span>
              </div>
            ))}
          </div>
        ):(
          <div className="space-y-2">
            {teams.map(t=>(
              <div key={t.id} className="flex items-center gap-2 glass border border-slate-100 rounded-xl px-3 py-2 shadow-sm">
                <input value={t.name} onChange={e=>rename(t.id,e.target.value)} className="flex-1 bg-transparent text-sm font-semibold text-slate-700 focus:outline-none"/>
                <button onClick={()=>setScore(t.id,t.score-5)} className="p-1 rounded-md hover:bg-slate-100 active:scale-90 transition-transform"><Minus size={13}/></button>
                <span className="w-12 text-center font-head font-bold text-slate-700">{t.score}</span>
                <button onClick={()=>setScore(t.id,t.score+5)} className="p-1 rounded-md hover:bg-slate-100 active:scale-90 transition-transform"><Plus size={13}/></button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [teams,setTeams]=useState(TEAMS_INIT);
  const [aId,setA]=useState("g1");
  const [bId,setB]=useState("g2");
  const [multiplier,setMultiplier]=useState(1);
  const [slide,setSlide]=useState(0);
  const [revealed,setRevealed]=useState(QUESTIONS.map(()=>({})));
  const [hints,setHints]=useState(QUESTIONS.map(()=>({})));
  const [panelOpen,setPanelOpen]=useState(false);
  const [revealModal,setRevealModal]=useState(null);
  const [confettiLayer,burst]=useConfetti();
  const [rainLayer,rainTrigger]=useConfettiRain();

  const adjust=(id,d)=>setTeams(p=>p.map(t=>t.id===id?{...t,score:Math.max(0,t.score+d)}:t));
  const openReveal=(qi,i,text,points)=>{
    setRevealed(prev=>{const next=[...prev];next[qi]={...next[qi],[i]:true};return next;});
    setRevealModal({qi,i,text,points});
  };
  const handleAward=(team)=>{
    if(!revealModal) return;
    adjust(team==="A"?aId:bId,revealModal.points);
    burst(window.innerWidth/2, window.innerHeight*0.4);
    setRevealModal(null);
  };
  const handleSkip=()=>setRevealModal(null);
  const toggleHint=(qi,i)=>setHints(prev=>{const next=[...prev];next[qi]={...next[qi],[i]:!next[qi][i]};return next;});
  const resetQuestion=qi=>{setRevealed(prev=>{const next=[...prev];next[qi]={};return next;});setRevealModal(null);};

  const qIndex=slide-1;
  const isIntro=slide===0, isResults=slide===TOTAL_SLIDES-1;

  useEffect(()=>{
    const onKey=(e)=>{
      if(panelOpen||revealModal) return;
      if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
      if(e.key==="ArrowRight") setSlide(s=>Math.min(TOTAL_SLIDES-1,s+1));
      if(e.key==="ArrowLeft") setSlide(s=>Math.max(0,s-1));
    };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[panelOpen,revealModal]);

  useEffect(()=>{
    if(isResults) rainTrigger();
  },[isResults]);

  return (
    <div className="min-h-screen w-full flex flex-col relative" style={{background:gradientFor(slide,TOTAL_SLIDES),transition:"background .6s ease"}}>
      <FloralBg/>
      <Header teams={teams} aId={aId} bId={bId} setA={setA} setB={setB} adjust={adjust} onTeams={()=>setPanelOpen(true)} multiplier={multiplier} setMultiplier={setMultiplier}/>

      <div key={slide} className="flex-1 flex flex-col">
        {isIntro && <IntroSlide/>}
        {!isIntro && !isResults && (
          <div className="flex-1 flex flex-col items-center px-6 py-6 max-w-5xl mx-auto w-full">
            <div className="enter w-full flex items-start justify-between mb-3">
              <span className="text-sky-500 text-sm font-bold tracking-widest">QUESTION {qIndex+1}</span>
              <button onClick={()=>resetQuestion(qIndex)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full glass border border-slate-100 text-slate-600 text-xs font-bold shadow-sm hover:scale-105 active:scale-95 transition-transform">
                <Undo size={13}/> Hide answers
              </button>
            </div>
            <h3 className="enter font-head text-2xl md:text-3xl font-bold text-emerald-900 text-left w-full mb-7" style={{animationDelay:"100ms"}}>{QUESTIONS[qIndex].prompt}</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5 w-full">
              {QUESTIONS[qIndex].answers.map(([text,points,hintText],i)=>(
                <AnswerTile key={i} index={i} text={text} points={points*multiplier} revealed={!!revealed[qIndex][i]} hint={!!hints[qIndex][i]} hintText={hintText}
                  onReveal={ii=>openReveal(qIndex,ii,text,points*multiplier)} onHint={ii=>toggleHint(qIndex,ii)} delay={140+i*60}/>
              ))}
            </div>
          </div>
        )}
        {isResults && <ResultsSlide teams={teams}/>}
      </div>

      <footer className="flex items-center justify-between px-6 py-3 glass border-t border-slate-100">
        <span className="text-[11px] text-slate-400">← → to navigate</span>
        <div className="flex items-center gap-3">
          <button onClick={()=>setSlide(s=>Math.max(0,s-1))} disabled={slide===0} className="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 disabled:opacity-20 hover:scale-110 active:scale-90 transition-transform"><ChL size={18}/></button>
          <span className="text-xs font-mono text-slate-500">{slide+1} / {TOTAL_SLIDES}</span>
          <button onClick={()=>setSlide(s=>Math.min(TOTAL_SLIDES-1,s+1))} disabled={slide===TOTAL_SLIDES-1} className="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 disabled:opacity-20 hover:scale-110 active:scale-90 transition-transform"><ChR size={18}/></button>
        </div>
      </footer>
      <TeamsPanel open={panelOpen} onClose={()=>setPanelOpen(false)} teams={teams} setTeams={setTeams}/>
      <RevealModal data={revealModal} teams={teams} aId={aId} bId={bId} onAward={handleAward} onSkip={handleSkip}/>
      {confettiLayer}
      {rainLayer}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
